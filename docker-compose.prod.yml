services:
  # ----------------------------------------------------------------------------
  # 1. Authoritative PostgreSQL with PostGIS Geospatial Extension
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: adhocx_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adhocx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adhocx_password}
      POSTGRES_DB: ${POSTGRES_DB:-adhocx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adhocx_user} -d ${POSTGRES_DB:-adhocx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adhocx_internal

  # ----------------------------------------------------------------------------
  # 2. Redis In-Memory Engine
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: adhocx_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adhocx_internal

  # ----------------------------------------------------------------------------
  # 3. AdhocX Backend API (NestJS + Prisma)
  # ----------------------------------------------------------------------------
  api:
    image: ghcr.io/prince364133/adhocx-api:latest
    container_name: adhocx_prod_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-adhocx_user}:${POSTGRES_PASSWORD:-adhocx_password}@postgres:5432/${POSTGRES_DB:-adhocx}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - adhocx_internal

  # ----------------------------------------------------------------------------
  # 4. AdhocX Admin Control Panel (Next.js Standalone)
  # ----------------------------------------------------------------------------
  admin:
    image: ghcr.io/prince364133/adhocx-admin:latest
    container_name: adhocx_prod_admin
    restart: always
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - adhocx_internal

  # ----------------------------------------------------------------------------
  # 5. AdhocX Marketing & SEO Content Portal (Astro Static + Nginx)
  # ----------------------------------------------------------------------------
  marketing:
    image: ghcr.io/prince364133/adhocx-marketing:latest
    container_name: adhocx_prod_marketing
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 3s
      retries: 3
    networks:
      - adhocx_internal

  # ----------------------------------------------------------------------------
  # 6. AdhocX Driver & Vendor Web Client (Flutter Web + Nginx)
  # ----------------------------------------------------------------------------
  mobile:
    image: ghcr.io/prince364133/adhocx-mobile:latest
    container_name: adhocx_prod_mobile
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 3s
      retries: 3
    networks:
      - adhocx_internal

  # ----------------------------------------------------------------------------
  # 7. Production Gateway Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: adhocx_prod_gateway
    restart: always
    depends_on:
      - api
      - admin
      - marketing
      - mobile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/nginx.conf:ro
    networks:
      - adhocx_internal

networks:
  adhocx_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
