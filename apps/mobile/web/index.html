<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="AdhocX - Corporate Mobility & On-Demand Dispatch" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AdhocX" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Google Sign-In Client ID -->
    <meta name="google-signin-client_id" content="886573696369-84dnfvb9jaegbqp8deosr3ucf8tq93ms.apps.googleusercontent.com" />

    <title>AdhocX</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        background-color: #0B1220;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      #loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0B1220;
        z-index: 99999;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      }

      .brand-title {
        font-size: 36px;
        font-weight: 900;
        color: #FFFFFF;
        letter-spacing: -1px;
        margin: 0 0 6px 0;
        user-select: none;
      }

      .brand-title span {
        color: #3B82F6;
      }

      .brand-sub {
        font-size: 11px;
        font-weight: 700;
        color: #94A3B8;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0 0 32px 0;
        user-select: none;
      }

      .pulse-loader {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top: 3px solid #2563EB;
        border-right: 3px solid #3B82F6;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #load-error {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0B1220;
        color: #CBD5E1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        z-index: 99998;
      }

      #load-error.visible {
        display: flex;
      }

      #load-error h2 {
        color: #60A5FA;
        margin: 0 0 12px;
        font-size: 1.3rem;
      }

      #load-error pre {
        background: #111827;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #1F2937;
        overflow: auto;
        max-width: 90%;
        font-size: 12px;
        text-align: left;
        color: #F87171;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Enterprise Branded Splash Preloader -->
    <div id="loading-container">
      <div class="brand-title">Adhoc<span>X</span></div>
      <div class="brand-sub">Corporate Mobility & Dispatch</div>
      <div class="pulse-loader"></div>
    </div>

    <!-- Shown when a fatal startup error occurs -->
    <div id="load-error">
      <h2>Something went wrong</h2>
      <p>The app couldn’t initialize properly. Check details below or refresh the page.</p>
      <pre id="load-error-detail" style="display: none;"></pre>
    </div>

    <script>
      (function () {
        window.parent.postMessage({ type: "LOADING_STARTED" }, "*");
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>

    <script>
      var appLoaded = false;

      function removeLoader() {
        if (appLoaded) return;
        appLoaded = true;
        var loader = document.getElementById("loading-container");
        if (loader) {
          loader.style.opacity = "0";
          loader.style.pointerEvents = "none";
          setTimeout(function () {
            loader.style.display = "none";
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 300);
        }
        hideLoadError();
        window.parent.postMessage({ type: "LOADING_COMPLETED" }, "*");
      }

      function hideLoadError() {
        var errEl = document.getElementById("load-error");
        if (errEl) {
          errEl.classList.remove("visible");
          errEl.style.display = "none";
        }
      }

      function showLoadError(message, detail) {
        if (appLoaded) return;
        removeLoader();
        var errEl = document.getElementById("load-error");
        if (errEl) {
          errEl.classList.add("visible");
        }
        if (detail) {
          var detailEl = document.getElementById("load-error-detail");
          if (detailEl) {
            detailEl.textContent = detail;
            detailEl.style.display = "block";
          }
        }
        window.parent.postMessage(
          { type: "LOADING_ERROR", message: message },
          "*",
        );
      }

      // 1. MutationObserver: Instant detection when Flutter canvas/view attaches to DOM
      var observer = new MutationObserver(function (mutations, obs) {
        var flutterEl = document.querySelector("flutter-view, flt-glass-pane, flt-scene-host, canvas");
        if (flutterEl) {
          removeLoader();
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 2. Framework & custom event listeners
      window.addEventListener("flutter-first-frame", removeLoader);
      window.addEventListener("flutter-app-rendered", removeLoader);

      // 3. Failsafe auto-dismiss (2 seconds max)
      setTimeout(removeLoader, 2000);

      // Capture errors but only show UI if not loaded and fatal
      window.onerror = function (message, source, lineno, colno, error) {
        console.error("[AdhocX Web Error]", message, source, lineno, colno, error);
        return false;
      };

      window.addEventListener("unhandledrejection", function (event) {
        console.warn("[AdhocX Web Unhandled Rejection]", event.reason);
      });
    </script>

    <script>
      // Navigation tracking
      (function (history) {
        const pushState = history.pushState;
        const replaceState = history.replaceState;

        function logNavigation(method, url) {
            if (!url) return;

            var actualPath = url;
            var lastHashSlash = url.lastIndexOf('#/');
            if (lastHashSlash !== -1) {
              actualPath = '/' + url.substring(lastHashSlash + 2);
            }

            var formattedUrl = actualPath;
            if (actualPath.startsWith('/') && !actualPath.startsWith('/#')) {
              formattedUrl = '/#' + actualPath;
            }

            window.parent.postMessage({
              type: "NAVIGATION",
              method: method,
              url: formattedUrl
            }, "*");
          }

        history.pushState = function (state, title, url) {
          logNavigation("pushState", url);
          return pushState.apply(history, arguments);
        };

        history.replaceState = function (state, title, url) {
          logNavigation("replaceState", url);
          return replaceState.apply(history, arguments);
        };

        window.addEventListener("popstate", function (event) {
          logNavigation("popstate", location.href);
        });
      })(window.history);
    </script>

    <!-- Plugin initialization code will be injected into flutter_plugins.js -->
    <script src="flutter_plugins.js" defer></script>
  </body>
</html>
