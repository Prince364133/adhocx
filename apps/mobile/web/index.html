<!DOCTYPE html>
<html>
  <head>

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="AdhocX - Corporate Mobility & On-Demand Dispatch" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AdhocX" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Google Sign-In Client ID & GSI Script -->
    <meta name="google-signin-client_id" content="886573696369-84dnfvb9jaegbqp8deosr3ucf8tq93ms.apps.googleusercontent.com" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Google Maps Platform JavaScript API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8uEHtGy96QPbx3eIxG0s0_WYlWpB8QVI&libraries=places"></script>

    <title>AdhocX</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        background-color: #0B1220;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      #loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0B1220;
        z-index: 99999;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      }

      .brand-title {
        font-size: 36px;
        font-weight: 900;
        color: #FFFFFF;
        letter-spacing: -1px;
        margin: 0 0 6px 0;
        user-select: none;
      }

      .brand-title span {
        color: #3B82F6;
      }

      .brand-sub {
        font-size: 11px;
        font-weight: 700;
        color: #94A3B8;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0 0 32px 0;
        user-select: none;
      }

      .pulse-loader {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top: 3px solid #2563EB;
        border-right: 3px solid #3B82F6;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #load-error {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0B1220;
        color: #CBD5E1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        z-index: 99998;
      }

      #load-error.visible {
        display: flex;
      }

      #load-error h2 {
        color: #60A5FA;
        margin: 0 0 12px;
        font-size: 1.3rem;
      }

      #load-error pre {
        background: #111827;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #1F2937;
        overflow: auto;
        max-width: 90%;
        font-size: 12px;
        text-align: left;
        color: #F87171;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Enterprise Branded Splash Preloader -->
    <div id="loading-container">
      <div class="brand-title">Adhoc<span>X</span></div>
      <div class="brand-sub">Corporate Mobility & Dispatch</div>
      <div class="pulse-loader"></div>
    </div>

    <!-- Shown when a fatal startup error occurs -->
    <div id="load-error">
      <h2>Something went wrong</h2>
      <p>The app couldn’t initialize properly. Check details below or refresh the page.</p>
      <pre id="load-error-detail" style="display: none;"></pre>
    </div>

    <script>
      (function () {
        window.parent.postMessage({ type: "LOADING_STARTED" }, "*");
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>

    <script>
      var appLoaded = false;

      function removeLoader() {
        if (appLoaded) return;
        appLoaded = true;
        var loader = document.getElementById("loading-container");
        if (loader) {
          loader.style.opacity = "0";
          loader.style.pointerEvents = "none";
          setTimeout(function () {
            loader.style.display = "none";
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 300);
        }
        hideLoadError();
        window.parent.postMessage({ type: "LOADING_COMPLETED" }, "*");
      }

      function hideLoadError() {
        var errEl = document.getElementById("load-error");
        if (errEl) {
          errEl.classList.remove("visible");
          errEl.style.display = "none";
        }
      }

      function showLoadError(message, detail) {
        if (appLoaded) return;
        removeLoader();
        var errEl = document.getElementById("load-error");
        if (errEl) {
          errEl.classList.add("visible");
        }
        if (detail) {
          var detailEl = document.getElementById("load-error-detail");
          if (detailEl) {
            detailEl.textContent = detail;
            detailEl.style.display = "block";
          }
        }
        window.parent.postMessage(
          { type: "LOADING_ERROR", message: message },
          "*",
        );
      }

      // 1. MutationObserver: Instant detection when Flutter canvas/view attaches to DOM
      var observer = new MutationObserver(function (mutations, obs) {
        var flutterEl = document.querySelector("flutter-view, flt-glass-pane, flt-scene-host, canvas");
        if (flutterEl) {
          removeLoader();
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 2. Framework & custom event listeners
      window.addEventListener("flutter-first-frame", removeLoader);
      window.addEventListener("flutter-app-rendered", removeLoader);

      // 3. Failsafe auto-dismiss (2 seconds max)
      setTimeout(removeLoader, 2000);

      // Capture errors and shield against third-party checkout chunk warnings
      window.onerror = function (message, source, lineno, colno, error) {
        if (source && (source.includes("razorpay") || source.includes("v2-entry") || source.includes("checkout"))) {
          console.warn("[Suppressed Gateway Chunk Notice]", message);
          return true; // prevent third party scripts from throwing fatal errors
        }
        console.error("[AdhocX Web Error]", message, source, lineno, colno, error);
        return false;
      };

      window.addEventListener("unhandledrejection", function (event) {
        var reasonStr = (event && event.reason && event.reason.toString()) || "";
        if (reasonStr.includes("razorpay") || reasonStr.includes("v2-entry") || reasonStr.includes("ChunkLoadError") || reasonStr.includes("Loading chunk")) {
          event.preventDefault();
          return;
        }
        console.warn("[AdhocX Web Unhandled Rejection]", event.reason);
      });
    </script>

    <script>
      // Navigation tracking (strictly send to parent only if running in iframe)
      (function (history) {
        const pushState = history.pushState;
        const replaceState = history.replaceState;

        function logNavigation(method, url) {
          if (!url) return;

          var actualPath = url;
          var lastHashSlash = url.lastIndexOf('#/');
          if (lastHashSlash !== -1) {
            actualPath = '/' + url.substring(lastHashSlash + 2);
          }

          var formattedUrl = actualPath;
          if (actualPath.startsWith('/') && !actualPath.startsWith('/#')) {
            formattedUrl = '/#' + actualPath;
          }

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: "NAVIGATION",
              method: method,
              url: formattedUrl
            }, "*");
          }
        }

        history.pushState = function (state, title, url) {
          logNavigation("pushState", url);
          return pushState.apply(history, arguments);
        };

        history.replaceState = function (state, title, url) {
          logNavigation("replaceState", url);
          return replaceState.apply(history, arguments);
        };

        window.addEventListener("popstate", function (event) {
          logNavigation("popstate", location.href);
        });
      })(window.history);
    </script>

    <!-- Razorpay Checkout Web Bridge (Isolated execution with full DOM teardown) -->
    <script>
      function purgeRazorpayElements() {
        try {
          var selectors = [
            '.razorpay-container',
            '.razorpay-backdrop',
            'iframe[name^="razorpay"]',
            'iframe[src*="razorpay"]',
            'iframe[class*="razorpay"]',
            'div[class*="razorpay"]'
          ];
          selectors.forEach(function(sel) {
            var elements = document.querySelectorAll(sel);
            for (var i = 0; i < elements.length; i++) {
              if (elements[i] && elements[i].parentNode) {
                elements[i].parentNode.removeChild(elements[i]);
              }
            }
          });
        } catch (_) {}
      }

      window.addEventListener("message", function(event) {
        if (event.data && typeof event.data === "object" && event.data.type === "OPEN_RAZORPAY_CHECKOUT") {
          var config = event.data.config || {};
          var token = config.token || ("tok_" + Date.now());
          var isDone = false;
          var rzpInstance = null;

          purgeRazorpayElements();

          function notifyAndTeardown(type, data) {
            if (isDone) return;
            isDone = true;

            try {
              if (rzpInstance && typeof rzpInstance.close === "function") {
                rzpInstance.close();
              }
            } catch (_) {}

            setTimeout(purgeRazorpayElements, 50);

            var payload = Object.assign({ type: type, token: token }, data);
            window.postMessage(payload, "*");
          }

          function launchRzp() {
            try {
              var options = {
                key: config.key,
                amount: config.amount,
                currency: config.currency || "INR",
                name: config.name || "AdhocX Mobility",
                description: config.description || "AdhocX Secure Payment",
                order_id: config.order_id,
                prefill: config.prefill || {},
                notes: config.notes || {},
                theme: config.theme || { color: "#5B42F3" },
                handler: function(response) {
                  notifyAndTeardown("RAZORPAY_PAYMENT_SUCCESS", {
                    paymentId: response.razorpay_payment_id || "",
                    orderId: response.razorpay_order_id || config.order_id,
                    signature: response.razorpay_signature || ""
                  });
                },
                modal: {
                  ondismiss: function() {
                    notifyAndTeardown("RAZORPAY_PAYMENT_FAILURE", {
                      errorMessage: "Payment cancelled by user",
                      errorCode: 0
                    });
                  }
                }
              };

              rzpInstance = new Razorpay(options);
              rzpInstance.on("payment.failed", function(response) {
                var errObj = response && response.error;
                var rawDesc = errObj && (errObj.description || errObj.reason || errObj.code);
                var msg = (rawDesc && rawDesc !== "undefined" && rawDesc !== "null") ? rawDesc : "Payment failed at gateway";
                notifyAndTeardown("RAZORPAY_PAYMENT_FAILURE", {
                  errorMessage: msg,
                  errorCode: (errObj && (errObj.code === "BAD_REQUEST_ERROR" ? 0 : 1)) || 1
                });
              });
              rzpInstance.open();
            } catch (err) {
              var errMsg = (err && err.message && err.message !== "undefined" && err.message !== "null") ? err.message : "Failed to initialize payment gateway";
              notifyAndTeardown("RAZORPAY_PAYMENT_FAILURE", {
                errorMessage: errMsg,
                errorCode: 1
              });
            }
          }

          if (typeof Razorpay === "undefined") {
            var existingScript = document.getElementById("razorpay-checkout-js");
            if (existingScript) {
              existingScript.addEventListener("load", launchRzp, { once: true });
            } else {
              var script = document.createElement("script");
              script.id = "razorpay-checkout-js";
              script.src = "https://checkout.razorpay.com/v1/checkout.js";
              script.async = true;
              script.onload = launchRzp;
              script.onerror = function() {
                notifyAndTeardown("RAZORPAY_PAYMENT_FAILURE", {
                  errorMessage: "Failed to load payment gateway SDK"
                });
              };
              document.head.appendChild(script);
            }
          } else {
            launchRzp();
          }
        }
      });
    </script>

    <!-- Plugin initialization code will be injected into flutter_plugins.js -->
    <script src="flutter_plugins.js" defer></script>
  </body>
</html>
