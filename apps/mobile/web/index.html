<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="AdhocX - Corporate Mobility & On-Demand Dispatch" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AdhocX" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Google Sign-In Client ID -->
    <meta name="google-signin-client_id" content="886573696369-84dnfvb9jaegbqp8deosr3ucf8tq93ms.apps.googleusercontent.com" />

    <title>AdhocX</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        background: #000;
        margin: 0;
        overflow: hidden;
      }

      #loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: black;
        z-index: 9999;
      }

      .loader {
        border: 6px solid rgba(255, 255, 255, 0.2);
        border-top: 6px solid #87ceeb;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      #load-error {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: black;
        color: #ccc;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        z-index: 9998;
      }

      #load-error.visible {
        display: flex;
      }

      #load-error h2 {
        color: #87ceeb;
        margin: 0 0 12px;
        font-size: 1.25rem;
      }

      #load-error pre {
        background: #1a1a1a;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
        max-width: 90%;
        font-size: 12px;
        text-align: left;
        color: #f87171;
        margin-top: 12px;
      }
    </style>
  </head>
  <body
    style="
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    "
  >
    <!-- Loader Container -->
    <div id="loading-container">
      <div class="loader"></div>
    </div>

    <!-- Shown when a fatal startup error occurs -->
    <div id="load-error">
      <h2>Something went wrong</h2>
      <p>The app couldn’t initialize properly. Check details below or refresh the page.</p>
      <pre id="load-error-detail" style="display: none;"></pre>
    </div>

    <script>
      (function () {
        window.parent.postMessage({ type: "LOADING_STARTED" }, "*");
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>

    <script>
      var appLoaded = false;

      function removeLoader() {
        var loader = document.getElementById("loading-container");
        if (loader) {
          loader.style.display = "none";
        }
      }

      function hideLoadError() {
        var errEl = document.getElementById("load-error");
        if (errEl) {
          errEl.classList.remove("visible");
          errEl.style.display = "none";
        }
      }

      function showLoadError(message, detail) {
        if (appLoaded) return;
        removeLoader();
        var errEl = document.getElementById("load-error");
        if (errEl) {
          errEl.classList.add("visible");
        }
        if (detail) {
          var detailEl = document.getElementById("load-error-detail");
          if (detailEl) {
            detailEl.textContent = detail;
            detailEl.style.display = "block";
          }
        }
        window.parent.postMessage(
          { type: "LOADING_ERROR", message: message },
          "*",
        );
      }

      window.addEventListener("flutter-first-frame", function () {
        appLoaded = true;
        removeLoader();
        hideLoadError();
        window.parent.postMessage({ type: "LOADING_COMPLETED" }, "*");
      });

      // Capture errors but only show UI if not loaded and fatal
      window.onerror = function (message, source, lineno, colno, error) {
        console.error("[AdhocX Web Error]", message, source, lineno, colno, error);
        return false;
      };

      window.addEventListener("unhandledrejection", function (event) {
        console.warn("[AdhocX Web Unhandled Rejection]", event.reason);
      });

      // Timeout fallback: only trigger if Flutter has not rendered after 45s
      setTimeout(function () {
        if (appLoaded) return;
        var loader = document.getElementById("loading-container");
        if (loader && loader.style.display !== "none") {
          showLoadError(
            "Loading timed out",
            "The app did not start in time. Please refresh the page.",
          );
        }
      }, 45000);
    </script>

    <script>
      // Navigation tracking
      (function (history) {
        const pushState = history.pushState;
        const replaceState = history.replaceState;

        function logNavigation(method, url) {
            if (!url) return;

            var actualPath = url;
            var lastHashSlash = url.lastIndexOf('#/');
            if (lastHashSlash !== -1) {
              actualPath = '/' + url.substring(lastHashSlash + 2);
            }

            var formattedUrl = actualPath;
            if (actualPath.startsWith('/') && !actualPath.startsWith('/#')) {
              formattedUrl = '/#' + actualPath;
            }

            window.parent.postMessage({
              type: "NAVIGATION",
              method: method,
              url: formattedUrl
            }, "*");
          }

        history.pushState = function (state, title, url) {
          logNavigation("pushState", url);
          return pushState.apply(history, arguments);
        };

        history.replaceState = function (state, title, url) {
          logNavigation("replaceState", url);
          return replaceState.apply(history, arguments);
        };

        window.addEventListener("popstate", function (event) {
          logNavigation("popstate", location.href);
        });
      })(window.history);
    </script>

    <!-- Plugin initialization code will be injected into flutter_plugins.js -->
    <script src="flutter_plugins.js" defer></script>
  </body>
</html>
