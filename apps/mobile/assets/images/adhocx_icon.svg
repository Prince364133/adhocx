<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Primary Theme Blue for "Adhoc" -->
    <linearGradient id="iconAdhocBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B42F3" />
      <stop offset="100%" stop-color="#4B22B6" />
    </linearGradient>

    <!-- Vibrant Brand Theme Orange Gradient for "X" -->
    <linearGradient id="iconOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Clean Container Border/Shadow -->
    <filter id="iconCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#5B42F3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean White Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#iconCardShadow)" />

  <!-- Natural Typography Wordmark Centered -->
  <text
    x="256"
    y="292"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="112"
    font-weight="800"
    letter-spacing="-1.5"
  ><tspan fill="url(#iconAdhocBlueGrad)">Adhoc</tspan><tspan fill="url(#iconOrangeGrad)">X</tspan></text>
</svg>
