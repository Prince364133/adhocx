<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Vibrant Multi-tone Gradient for the 'X' -->
    <linearGradient id="brandGradX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Wordmark Text -->
  <g id="brand-logo" transform="translate(10, 0)">
    <!-- "Adhoc" in Pure White Bold Sans -->
    <text
      x="0"
      y="110"
      font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="96"
      font-weight="800"
      fill="#FFFFFF"
      letter-spacing="-3"
    >Adhoc</text>

    <!-- "X" in Dynamic Glowing Gradient -->
    <text
      x="315"
      y="110"
      font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="104"
      font-weight="900"
      fill="url(#brandGradX)"
      letter-spacing="-1"
      filter="url(#textGlow)"
    >X</text>

    <!-- Subtitle / Tagline -->
    <text
      x="4"
      y="146"
      font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="16"
      font-weight="600"
      fill="#94A3B8"
      letter-spacing="6"
    >MOBILITY &amp; FLEET PLATFORM</text>
  </g>
</svg>
