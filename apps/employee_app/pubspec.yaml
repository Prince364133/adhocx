name: adhocx_employee
description: AdhocX Employee - Corporate Employee Commuter Mobile Application
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.1.4
  cached_network_image: ^3.3.1
  fluttertoast: ^8.2.4
  go_router: ^14.6.1
  provider: ^6.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/adhocx-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/adhocx_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
