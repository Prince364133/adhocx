name: adhocx_employee
description: AdhocX Employee Commuter Mobile App - Corporate Employee Transportation
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  google_fonts: ^6.1.0
  go_router: ^14.6.1
  provider: ^6.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.1.4
  sizer: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
