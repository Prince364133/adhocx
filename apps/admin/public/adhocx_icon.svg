<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.5" />
    </linearGradient>

    <!-- Gradient for 'X' -->
    <linearGradient id="iconTextX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="4" />

  <!-- Ambient Glow Behind Text -->
  <circle cx="256" cy="256" r="140" fill="#6366F1" opacity="0.15" filter="url(#iconGlow)" />

  <!-- Text-based Icon Content -->
  <g id="text-icon" text-anchor="middle">
    <!-- "Adhoc" -->
    <text
      x="256"
      y="240"
      font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="92"
      font-weight="800"
      fill="#FFFFFF"
      letter-spacing="-2"
    >Adhoc</text>

    <!-- "X" -->
    <text
      x="256"
      y="350"
      font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="120"
      font-weight="900"
      fill="url(#iconTextX)"
      letter-spacing="-1"
      filter="url(#iconGlow)"
    >X</text>
  </g>
</svg>
