# Throwaway Postgres + Redis for the local Corporate ETS load test.
# Separate project name, ports and volumes so it never touches the dev stack or any shared server.
#   docker compose -p adhocx-loadtest -f apps/api/load-test/docker-compose.loadtest.yml up -d --wait
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: lt
      POSTGRES_PASSWORD: lt
      POSTGRES_DB: adhocx_lt
    command: postgres -c max_connections=400 -c shared_buffers=256MB
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lt -d adhocx_lt']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    command: redis-server --save '' --appendonly no
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
