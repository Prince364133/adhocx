name: "Deploy Marketing Website to Cloudflare Workers"

on:
  push:
    branches: [production, main]
  pull_request:
    branches: [production, main]
    paths:
      - "apps/marketing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-marketing-cloudflare.yml"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target (production = live adhocx.com, preview = version preview URL)"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  deployments: write

concurrency:
  group: marketing-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: "Build & Deploy Marketing Site (Cloudflare Workers)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro Marketing Website
        env:
          API_URL: https://api.adhocx.com/api/v1
          PUBLIC_API_URL: https://api.adhocx.com/api/v1
        run: pnpm --filter @adhocx/marketing build

      - name: Verify Cloudflare Secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets must be configured in GitHub Actions."
            exit 1
          fi

      - name: Determine Deployment Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_prod=$( [ "${{ github.event.inputs.deploy_target }}" = "production" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "alias=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "production" ]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
            echo "alias=production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
            echo "alias=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
            echo "alias=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Production Marketing Site to Cloudflare Workers
        if: steps.mode.outputs.is_prod == 'true'
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Upload Preview Version to Cloudflare Workers
        if: steps.mode.outputs.is_prod != 'true'
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4 versions upload --preview-alias=${{ steps.mode.outputs.alias }}
