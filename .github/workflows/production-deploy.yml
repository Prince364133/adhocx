name: "Production CI/CD - Docker GHCR and AWS EC2 Deploy"

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  # ============================================================================
  # 1. Build and Publish Multi-Stage Docker Images to GHCR
  # ============================================================================
  build-and-push:
    name: "Build and Push (${{ matrix.service.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            image_name: adhocx-api
            dockerfile: apps/api/Dockerfile
            context: .
          - name: admin
            image_name: adhocx-admin
            dockerfile: apps/admin/Dockerfile
            context: .
          - name: marketing
            image_name: adhocx-marketing
            dockerfile: apps/marketing/Dockerfile
            context: .
          - name: mobile
            image_name: adhocx-mobile
            dockerfile: apps/mobile/Dockerfile
            context: .

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.adhocx.com/api/v1

  # ============================================================================
  # 2. Deploy Container Fleet to AWS EC2 Instance
  # ============================================================================
  deploy:
    name: "Deploy to AWS EC2"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent and Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "❌ EC2_HOST or EC2_SSH_KEY secret is not configured. Skipping remote deployment."
            exit 1
          fi

          echo "Configuring SSH key..."
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "🚀 Syncing configuration to EC2 ($EC2_HOST)..."
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "mkdir -p /home/$EC2_USER/adhocx/infrastructure/nginx/ssl"

          scp -i ~/.ssh/id_rsa docker-compose.prod.yml "$EC2_USER@$EC2_HOST:/home/$EC2_USER/adhocx/docker-compose.prod.yml"
          scp -i ~/.ssh/id_rsa infrastructure/nginx/production.conf "$EC2_USER@$EC2_HOST:/home/$EC2_USER/adhocx/infrastructure/nginx/production.conf"
          scp -i ~/.ssh/id_rsa infrastructure/nginx/ssl/* "$EC2_USER@$EC2_HOST:/home/$EC2_USER/adhocx/infrastructure/nginx/ssl/" || true

          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "
            if [ ! -f /home/$EC2_USER/adhocx/infrastructure/nginx/ssl/cert.pem ]; then
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /home/$EC2_USER/adhocx/infrastructure/nginx/ssl/key.pem \
                -out /home/$EC2_USER/adhocx/infrastructure/nginx/ssl/cert.pem \
                -subj '/CN=*.adhocx.com'
            fi
          "

          echo "Writing production environment file on EC2..."
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "cat << 'ENV_EOF' > /home/$EC2_USER/adhocx/.env.production
          NODE_ENV=production
          PORT=3000
          API_PREFIX=api/v1
          APP_URL=https://api.adhocx.com
          CORS_ORIGINS=https://app.adhocx.com,https://admin.adhocx.com,https://adhocx.com,https://www.adhocx.com,https://api.adhocx.com,http://localhost:7002,http://localhost:7003,http://localhost:3000,http://localhost:3001,http://3.110.42.191
          NEXT_PUBLIC_API_URL=https://api.adhocx.com/api/v1
          NEXT_PUBLIC_WS_URL=wss://api.adhocx.com
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'adhocx_user' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'adhocx_prod_db_sec_pass_2026!' }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'adhocx' }}
          DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://adhocx_user:adhocx_prod_db_sec_pass_2026!@postgres:5432/adhocx?schema=public' }}
          REDIS_URL=${{ secrets.REDIS_URL || 'rediss://red-dafi1ftbedkc739bbovg:YP3C2SCtDTlvZL2un0PgQ12OUAiSlcud@virginia-keyvalue.render.com:6379' }}
          REDIS_TLS=true
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET || '743e797761e596e86c36430b92a410064e88ae5b6918a1bf5ce781ecf4aee98a' }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET || 'ea378b0b14df7d55f663bcc0373df4bee1df1f6f1545d12d9d4927e02afd936f' }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID || 'rzp_live_TJ4cJdMCagilvq' }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET || 'c5RbhL5k0DIQKTDOQot3cyei' }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET || 'rzp_webhook_secret_placeholder' }}
          RAZORPAY_WEBHOOK_URL=https://api.adhocx.com/api/v1/payments/webhooks/razorpay
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'AQ.Ab8RN6KMmpoX5Rw278uN7G6ekxY4JmMdxoi3iDsRw0s1lbvtgA' }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID || 'e2d2bf9eb658189a975bb2edfc73b377' }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID || '84969ae0c79a6fab61d239619eb33933' }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY || '349f24896749875c7154d23ef9be36a5f8fc0fd070a4fc751d0d3382bf405c80' }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME || 'adhocx' }}
          R2_ENDPOINT=${{ secrets.R2_ENDPOINT || 'https://e2d2bf9eb658189a975bb2edfc73b377.r2.cloudflarestorage.com' }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL || 'https://pub-6b0e7f5bbf684bc7aa7bb5f04e679bf7.r2.dev' }}
          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER=${{ secrets.SMTP_USER || 'adhocx.ofc@gmail.com' }}
          SMTP_PASS=${{ secrets.SMTP_PASS || 'btow vbtx mxnp dvys' }}
          SMTP_FROM_NAME=${{ secrets.SMTP_FROM_NAME || 'AdhocX' }}
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL || 'adhocx.ofc@gmail.com' }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '886573696369-84dnfvb9jaegbqp8deosr3ucf8tq93ms.apps.googleusercontent.com' }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || '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' }}
          GOOGLE_PROJECT_ID=${{ secrets.GOOGLE_PROJECT_ID || 'adhocx-507407' }}
          ENV_EOF"

          echo "🚀 Pulling latest container images and launching services..."
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "
            cd /home/$EC2_USER/adhocx
            echo '$GITHUB_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml restart gateway
            
            echo 'Waiting for database to be ready...'
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T api npx prisma db push --skip-generate || true

            echo 'Pruning dangling images...'
            docker image prune -f

            echo 'Verifying services health...'
            sleep 5
            curl -f http://localhost/healthz || exit 1
            curl -f http://localhost/api/v1/health || true
            echo '✅ Deployment complete and healthy!'
          "
