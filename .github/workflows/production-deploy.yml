name: Production CI/CD — Docker GHCR & AWS EC2 Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  # ============================================================================
  # 1. Build and Publish Multi-Stage Docker Images to GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            image_name: adhocx-api
            dockerfile: apps/api/Dockerfile
            context: .
          - name: admin
            image_name: adhocx-admin
            dockerfile: apps/admin/Dockerfile
            context: .
          - name: marketing
            image_name: adhocx-marketing
            dockerfile: apps/marketing/Dockerfile
            context: .
          - name: mobile
            image_name: adhocx-mobile
            dockerfile: apps/mobile/Dockerfile
            context: .

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ============================================================================
  # 2. Deploy Container Fleet to AWS EC2 Instance
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent & Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "❌ EC2_HOST or EC2_SSH_KEY secret is not configured. Skipping remote deployment."
            exit 1
          fi

          echo "Configuring SSH key..."
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "🚀 Syncing configuration to EC2 ($EC2_HOST)..."
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "mkdir -p /home/$EC2_USER/adhocx/infrastructure/nginx"

          scp -i ~/.ssh/id_rsa docker-compose.prod.yml "$EC2_USER@$EC2_HOST:/home/$EC2_USER/adhocx/docker-compose.prod.yml"
          scp -i ~/.ssh/id_rsa infrastructure/nginx/production.conf "$EC2_USER@$EC2_HOST:/home/$EC2_USER/adhocx/infrastructure/nginx/production.conf"

          echo "Writing production environment file..."
          cat << 'EOF' > .env.production
NODE_ENV=production
PORT=3000
API_PREFIX=api/v1
POSTGRES_USER=${{ secrets.POSTGRES_USER || 'adhocx_user' }}
POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'adhocx_prod_db_sec_pass_2026!' }}
POSTGRES_DB=${{ secrets.POSTGRES_DB || 'adhocx' }}
DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER || 'adhocx_user' }}:${{ secrets.POSTGRES_PASSWORD || 'adhocx_prod_db_sec_pass_2026!' }}@postgres:5432/${{ secrets.POSTGRES_DB || 'adhocx' }}?schema=public
REDIS_URL=redis://redis:6379
JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
SMTP_HOST=${{ secrets.SMTP_HOST }}
SMTP_PORT=${{ secrets.SMTP_PORT }}
SMTP_USER=${{ secrets.SMTP_USER }}
SMTP_PASS=${{ secrets.SMTP_PASS }}
SMTP_FROM_NAME=${{ secrets.SMTP_FROM_NAME }}
SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
GOOGLE_PROJECT_ID=${{ secrets.GOOGLE_PROJECT_ID }}
EOF

          scp -i ~/.ssh/id_rsa .env.production "$EC2_USER@$EC2_HOST:/home/$EC2_USER/adhocx/.env.production"

          echo "🚀 Pulling latest container images and launching services..."
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "
            cd /home/$EC2_USER/adhocx
            echo '$GITHUB_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo 'Waiting for database to be ready...'
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T api npx prisma db push --skip-generate || true

            echo 'Pruning dangling images...'
            docker image prune -f

            echo 'Verifying services health...'
            sleep 5
            curl -f http://localhost/healthz || exit 1
            curl -f http://localhost/api/v1/health || true
            echo '✅ Deployment complete and healthy!'
          "
