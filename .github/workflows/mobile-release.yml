name: "Build and Release Flutter Mobile (APK, AAB, iOS)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Build Android APK & AAB (Google Play Store Bundle)
  # ============================================================================
  build-android:
    name: "Build Android (APK & AAB)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: |
          flutter pub get

      - name: Build Android APK (Release)
        working-directory: apps/mobile
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=API_URL=http://3.110.42.191/api/v1 \
            --dart-define=SUPABASE_URL=https://ybqxhawowjktupfizfod.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlicXhoYXdvd2prdHVwZml6Zm9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTQ5OTgsImV4cCI6MjEwMzQzMDk5OH0.grjHadhTvuvcyLsF7CNoY4U73cL1bI3vJOsBaV4Bj1Q

      - name: Build Android App Bundle (AAB for Play Store)
        working-directory: apps/mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --dart-define=API_URL=http://3.110.42.191/api/v1 \
            --dart-define=SUPABASE_URL=https://ybqxhawowjktupfizfod.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlicXhoYXdvd2prdHVwZml6Zm9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTQ5OTgsImV4cCI6MjEwMzQzMDk5OH0.grjHadhTvuvcyLsF7CNoY4U73cL1bI3vJOsBaV4Bj1Q

      - name: Prepare Android Release Artifacts
        run: |
          mkdir -p release-android
          TAG="${{ github.event.inputs.version_tag || github.ref_name || 'v1.0.0' }}"
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "release-android/adhocx-driver-vendor-${TAG}.apk"
          cp apps/mobile/build/app/outputs/bundle/release/app-release.aab "release-android/adhocx-driver-vendor-${TAG}.aab"
          echo "Android artifacts ready:"
          ls -lh release-android/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: adhocx-android-apk
          path: release-android/*.apk
          retention-days: 14

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: adhocx-android-aab
          path: release-android/*.aab
          retention-days: 14

  # ============================================================================
  # 2. Build iOS Release Bundle (macOS Runner)
  # ============================================================================
  build-ios:
    name: "Build iOS (Release App & Archive)"
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: |
          flutter precache --ios
          flutter pub get

      - name: Build iOS App (Release Unsigned)
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_URL=http://3.110.42.191/api/v1 \
            --dart-define=SUPABASE_URL=https://ybqxhawowjktupfizfod.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlicXhoYXdvd2prdHVwZml6Zm9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTQ5OTgsImV4cCI6MjEwMzQzMDk5OH0.grjHadhTvuvcyLsF7CNoY4U73cL1bI3vJOsBaV4Bj1Q

      - name: Package iOS Distribution Archive
        run: |
          mkdir -p release-ios/Payload
          TAG="${{ github.event.inputs.version_tag || github.ref_name || 'v1.0.0' }}"
          cp -r apps/mobile/build/ios/iphoneos/Runner.app release-ios/Payload/
          cd release-ios
          zip -r "adhocx-driver-vendor-${TAG}-ios.zip" Payload
          rm -rf Payload
          echo "iOS archive ready:"
          ls -lh

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: adhocx-ios-release
          path: release-ios/*.zip
          retention-days: 14

  # ============================================================================
  # 3. Publish Unified GitHub Release with All Mobile Binaries
  # ============================================================================
  publish-release:
    name: "Publish GitHub Mobile Release"
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: adhocx-android-apk
          path: all-releases

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: adhocx-android-aab
          path: all-releases

      - name: Download iOS Archive
        uses: actions/download-artifact@v4
        with:
          name: adhocx-ios-release
          path: all-releases

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name || 'v1.0.0' }}"
          echo "Publishing release for tag: $TAG"
          ls -lh all-releases/

          gh release create "$TAG" all-releases/* \
            --title "AdhocX Mobile Release $TAG" \
            --notes "### AdhocX Driver & Vendor Mobile Release ($TAG)
            
            This release contains the production-ready distribution binaries for the AdhocX Flutter application:
            
            - **Android APK (.apk)**: Direct installable binary for Android devices (Driver & Vendor testing).
            - **Android App Bundle (.aab)**: Production bundle for publishing to the Google Play Store Console.
            - **iOS Release Archive (.zip)**: Compiled iOS Runner bundle for App Store Connect / TestFlight / ad-hoc testing.
            
            Built with Flutter Stable channel & automated GitHub Actions CI/CD." \
            --repo "${{ github.repository }}" || \
          gh release upload "$TAG" all-releases/* --clobber --repo "${{ github.repository }}"
