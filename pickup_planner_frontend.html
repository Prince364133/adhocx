<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickup Route Planner</title>
  <style>
    :root { color-scheme: light; --ink:#172126; --muted:#60717a; --line:#d8dedf; --panel:#f5f7f7; --danger:#b91c1c; --office:#166534; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:Segoe UI, sans-serif; }
    main { max-width:1500px; margin:auto; padding:16px; }
    h1 { margin:0 0 16px; font-size:24px; }
    form { display:grid; grid-template-columns:repeat(4,minmax(180px,1fr)); gap:12px; padding:16px; border:1px solid var(--line); background:var(--panel); }
    label { display:grid; gap:5px; font-size:13px; font-weight:600; }
    input,select { min-height:38px; padding:8px; border:1px solid #acb6ba; background:white; font:inherit; }
    .wide { grid-column:span 2; }
    .actions { display:flex; gap:8px; align-items:end; }
    button { min-height:38px; border:1px solid #64777e; background:white; cursor:pointer; font-weight:700; }
    button.primary { background:#183f4a; color:white; border-color:#183f4a; }
    #status { min-height:24px; }
  #progress { width:100%; height:18px; accent-color:#183f4a; }
    #summary { display:grid; grid-template-columns:repeat(5,1fr); border:1px solid var(--line); border-bottom:0; }
    .metric { padding:12px; border-right:1px solid var(--line); background:var(--panel); }
    .metric:last-child { border-right:0; }
    .metric span { display:block; color:var(--muted); font-size:12px; }
    .metric strong { font-size:22px; }
    #layout { display:grid; grid-template-columns:340px minmax(0,1fr); height:720px; border:1px solid var(--line); }
    #routes { overflow-y:auto; border-right:1px solid var(--line); }
    #routes h2 { position:sticky; top:0; z-index:2; margin:0; padding:12px 16px; background:white; border-bottom:1px solid var(--line); font-size:16px; }
    .route { border-bottom:1px solid var(--line); }
    .route button.route-button { width:100%; border:0; border-bottom:1px solid transparent; padding:12px 16px; text-align:left; }
    .route button[aria-expanded=true] { background:#eaf1f3; }
    .route button span { display:block; }
    .route button small { color:var(--muted); }
    .details { padding:0 16px 12px; font-size:13px; }
    .details ol { margin:6px 0 12px; padding-left:22px; }
    .outside { color:var(--danger); font-weight:700; }
    #map { min-height:500px; }
    @media(max-width:900px) { form { grid-template-columns:repeat(2,1fr); } #layout { grid-template-columns:1fr; height:auto; } #routes { max-height:380px; border-right:0; } #map { height:560px; } #summary { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
<main>
  <h1>Corporate Pickup Route Planner</h1>
  <form id="planner">
    <label>Office address / central location<input name="office" required value=""></label>
    <label>Office login date/time<input name="login_time" required type="datetime-local"></label>
    <label>Logout date/time (optional)<input name="logout_time" type="datetime-local"></label>
    <label>Office radius km<input name="office_radius_km" required type="number" min="1" max="500" value="50"></label>
    <label>Safety buffer minutes<input name="buffer_minutes" required type="number" min="0" max="180" value="15"></label>
    <label>Pickup wait minutes<input name="pickup_wait_minutes" required type="number" min="0" max="60" value="5"></label>
    <label>Maximum cab capacity<input name="cab_capacity" required type="number" min="1" max="12" value="3"></label>
    <label>Routing mode<select name="routing_preference"><option value="TRAFFIC_AWARE">Traffic-aware, optimize pickups</option><option value="TRAFFIC_AWARE_OPTIMAL">Traffic-aware, preserve order</option></select></label>
    <label class="wide">Employee CSV<input name="employees_csv" required type="file" accept=".csv,text/csv"></label>
    <div class="actions"><button class="primary" type="submit">Calculate routes</button><a href="/sample.csv" download><button type="button">Sample CSV</button></a></div>
    <label><input name="avoid_tolls" type="checkbox" value="true"> Avoid toll roads</label>
    <label><input name="avoid_highways" type="checkbox" value="true"> Avoid highways</label>
  </form>
  <p id="status" role="status"><progress id="progress" value="0" max="100" hidden></progress></p>
  <div id="summary" hidden></div>
  <div id="layout">
    <aside id="routes"><h2>Routes</h2><div id="route-list">Calculate a plan.</div></aside>
    <div id="map" aria-label="Google route map"></div>
  </div>
</main>
<script>
  let plan=null, map, selectedCab=null, routes=[], markers=[], lines=[], officeMarker, officeCircle, info;
  const colors=['#c2410c','#047857','#1d4ed8','#a21caf','#b91c1c','#0e7490','#4d7c0f','#7c2d12'];
  function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  window.initMap=()=>{ map=new google.maps.Map(document.getElementById('map'),{center:{lat:17.385,lng:78.4867},zoom:11}); info=new google.maps.InfoWindow(); };
  function clearMap(){[...lines,...markers].forEach(x=>x.setMap(null));lines=[];markers=[];if(officeMarker)officeMarker.setMap(null);if(officeCircle)officeCircle.setMap(null)}
  function pickupMarker(stop,route,index){
    const marker=new google.maps.Marker({map,position:{lat:stop.lat,lng:stop.lng},label:{text:String.fromCharCode(65+index),color:'#fff'},title:`${stop.name} - ${stop.eta}${stop.out_of_radius?' - outside radius':''}`,icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:stop.out_of_radius?'#b91c1c':colors[(route.cab-1)%colors.length],fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
    marker.addListener('click',()=>{info.setContent(`<b>${esc(stop.name)}</b><br>${esc(stop.matched_address)}${stop.out_of_radius?'<br><b class="outside">Outside office radius</b>':''}<br>${stop.office_distance_km} km from office<br>Pickup ${esc(stop.eta)}; dwell until ${esc(stop.dwell_until)}<br>${esc(stop.next_stop)} in ${stop.travel_to_next_minutes} min (${esc(stop.arrival_at_next)})`);info.open({anchor:marker,map})});
    markers.push(marker);
  }
  function showRoute(cab){selectedCab=cab;renderRoutes();markers.forEach(m=>m.setMap(null));markers=[];const route=plan.routes.find(r=>r.cab===cab);if(!route)return;const bounds=new google.maps.LatLngBounds();route.stops.forEach((s,i)=>{pickupMarker(s,route,i);bounds.extend({lat:s.lat,lng:s.lng})});bounds.extend({lat:plan.office.lat,lng:plan.office.lng});map.fitBounds(bounds,48)}
  function renderRoutes(){document.getElementById('route-list').innerHTML=plan.routes.map(r=>`<article class="route"><button type="button" class="route-button" data-cab="${r.cab}" aria-expanded="${r.cab===selectedCab}"><span><b>Route ${r.cab}</b> · ${r.stops.length} pickups</span><small>${esc(r.departure)} → ${esc(r.arrival)} · ${r.distance_km} km · ${r.stops.filter(s=>s.out_of_radius).length} outside</small></button><div class="details" ${r.cab===selectedCab?'':'hidden'}><p>Driver: ${esc(r.driver_start)}<br>${esc(r.status)} · ${esc(r.buffer_status)}</p><ol>${r.stops.map((s,i)=>`<li><b>${String.fromCharCode(65+i)}. ${esc(s.name)}</b><br>${esc(s.matched_address)}<br>${s.office_distance_km} km from office${s.out_of_radius?' · <span class="outside">OUTSIDE RADIUS</span>':''}<br>Pickup ${esc(s.eta)}; dwell ${esc(s.dwell_until)}<br>To ${esc(s.next_stop)}: ${s.travel_to_next_minutes} min; arrive ${esc(s.arrival_at_next)}</li>`).join('')}</ol></div></article>`).join('')}
  function renderPlan(result){plan=result;clearMap();const bounds=new google.maps.LatLngBounds();plan.routes.forEach((r,index)=>{const path=r.path.map(([lat,lng])=>({lat,lng}));const line=new google.maps.Polyline({map,path,strokeColor:colors[index%colors.length],strokeWeight:4,geodesic:true});lines.push(line);path.forEach(p=>bounds.extend(p));const start=r.stops[0];if(start){const marker=new google.maps.Marker({map,position:{lat:start.lat,lng:start.lng},label:{text:`R${r.cab}`,color:'#fff'},title:`Route ${r.cab}`,icon:{path:google.maps.SymbolPath.CIRCLE,scale:13,fillColor:colors[index%colors.length],fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});marker.addListener('click',()=>showRoute(r.cab));markers.push(marker)}});
    officeCircle=new google.maps.Circle({map,center:{lat:plan.office.lat,lng:plan.office.lng},radius:plan.office_radius_km*1000,strokeColor:'#176b87',fillColor:'#176b87',fillOpacity:.035,strokeWeight:2});officeMarker=new google.maps.Marker({map,position:{lat:plan.office.lat,lng:plan.office.lng},label:{text:'HQ',color:'#fff'},title:plan.office.name,icon:{path:google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,scale:7,fillColor:'#166534',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});bounds.extend({lat:plan.office.lat,lng:plan.office.lng});map.fitBounds(bounds,40);
    document.getElementById('summary').innerHTML=`<div class="metric"><span>Routes</span><strong>${plan.cab_count}</strong></div><div class="metric"><span>Employees</span><strong>${plan.employee_count}</strong></div><div class="metric"><span>Meet login</span><strong>${plan.routes.filter(r=>r.status==='Meets deadline').length}/${plan.cab_count}</strong></div><div class="metric"><span>Meet buffer</span><strong>${plan.routes.filter(r=>r.buffer_status==='Meets buffer').length}/${plan.cab_count}</strong></div><div class="metric"><span>Outside radius</span><strong>${plan.out_of_radius_count}</strong></div>`;document.getElementById('summary').hidden=false;renderRoutes();}
  document.getElementById('route-list').addEventListener('click',e=>{const b=e.target.closest('[data-cab]');if(b)showRoute(Number(b.dataset.cab))});
  function setProgress(status,progress,message,percent){progress.value=percent;status.replaceChildren(document.createTextNode(`${message} · ${percent}% `),progress)}
  document.getElementById('planner').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');const progress=document.getElementById('progress');progress.hidden=false;progress.value=0;status.childNodes.forEach(node=>{if(node.nodeType===Node.TEXT_NODE)node.remove()});status.textContent='Starting route calculation...';status.appendChild(progress);let streamed={employee_count:0,cab_count:0,out_of_radius_count:0,office_radius_km:Number(e.currentTarget.elements.office_radius_km.value),office:null,routes:[]};const response=await fetch('/api/plan/stream',{method:'POST',body:new FormData(e.currentTarget)});if(!response.ok){const result=await response.json();status.textContent=result.error||'Route calculation failed';return}const reader=response.body.getReader();const decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(value){buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop();for(const line of lines){if(!line.trim())continue;const event=JSON.parse(line);if(event.type==='office_geocoded'){streamed.office={name:event.data.office,lat:event.data.coordinates.lat,lng:event.data.coordinates.lng};setProgress(status,progress,'Office geocoded',event.percent);continue}if(event.type==='progress'){setProgress(status,progress,event.message,event.percent);continue}if(event.type==='geocoded'){setProgress(status,progress,`Geocoding ${event.data.completed}/${event.data.total}`,event.percent);continue}if(event.type==='route_complete'){const r=event.data.route;streamed.routes.push(r);streamed.routes.sort((a,b)=>a.cab-b.cab);streamed.cab_count=event.data.total;if(streamed.office){streamed.employee_count=streamed.employee_count||r.stops.length;streamed.out_of_radius_count=streamed.routes.flatMap(x=>x.stops).filter(s=>s.out_of_radius).length;renderPlan({...streamed})}setProgress(status,progress,`Route ${event.data.completed} of ${event.data.total} calculated`,event.percent);continue}if(event.type==='complete'){streamed=event.data.plan;setProgress(status,progress,'Route plan ready',100);renderPlan(streamed);continue}if(event.type==='error'){status.textContent=event.message;return}}}if(done)break}});
  const now=new Date(Date.now()-new Date().getTimezoneOffset()*60000);document.querySelector('[name=login_time]').value=new Date(now.getTime()+24*60*60*1000).toISOString().slice(0,16);
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{GOOGLE_BROWSER_KEY}}&callback=initMap&loading=async&v=weekly"></script>
</body>
</html>
