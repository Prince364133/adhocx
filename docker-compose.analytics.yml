version: '3.8'

services:
  # Open-Source Metabase Business Intelligence & Analytics Suite
  # Connected to PostgreSQL with read-only credentials for Intern Data Analysts
  metabase:
    image: metabase/metabase:v0.49.13
    container_name: adhocx_metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3030}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Asia/Kolkata
    volumes:
      - metabase_data:/metabase-data
    networks:
      - adhocx_network

volumes:
  metabase_data:
