version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: adhocx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-adhocx_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adhocx_password}
      POSTGRES_DB: ${DB_NAME:-adhocx_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-adhocx_user} -d ${DB_NAME:-adhocx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: adhocx_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: adhocx_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-adhocx_user}:${DB_PASSWORD:-adhocx_password}@postgres:5432/${DB_NAME:-adhocx_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-adhocx_super_secret_jwt_key_32_chars_long!}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile
    container_name: adhocx_admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://api:3000/api/v1
    ports:
      - "${ADMIN_PORT:-3001}:3001"

volumes:
  postgres_data:
  redis_data:
