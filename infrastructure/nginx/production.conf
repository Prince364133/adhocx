# ==============================================================================
# AdhocX Production Gateway Reverse Proxy (Nginx)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # SSL / TLS Settings for Cloudflare & HTTPS
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upstream services
    upstream api_service {
        server api:3000;
        keepalive 32;
    }

    upstream admin_service {
        server admin:3001;
        keepalive 32;
    }

    upstream marketing_service {
        server marketing:80;
        keepalive 32;
    }

    upstream mobile_service {
        server mobile:80;
        keepalive 32;
    }

    # -------------------------------------------------------------
    # Virtual Host 1: Marketing / Main Website (adhocx.com & www)
    # -------------------------------------------------------------
    server {
        listen 80;
        listen 443 ssl;
        server_name adhocx.com www.adhocx.com;

        location /healthz {
            access_log off;
            return 200 "adhocx-marketing-healthy\n";
        }

        location / {
            proxy_pass http://marketing_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -------------------------------------------------------------
    # Virtual Host 2: Flutter Web User & Driver App (app.adhocx.com)
    # -------------------------------------------------------------
    server {
        listen 80;
        listen 443 ssl;
        server_name app.adhocx.com m.adhocx.com;

        location /healthz {
            access_log off;
            return 200 "adhocx-mobile-healthy\n";
        }

        location / {
            proxy_pass http://mobile_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -------------------------------------------------------------
    # Virtual Host 3: Admin Dashboard (admin.adhocx.com)
    # -------------------------------------------------------------
    server {
        listen 80;
        listen 443 ssl;
        server_name admin.adhocx.com;

        location /healthz {
            access_log off;
            return 200 "adhocx-admin-healthy\n";
        }

        location / {
            proxy_pass http://admin_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -------------------------------------------------------------
    # Virtual Host 4: Backend API & Docs (api.adhocx.com)
    # -------------------------------------------------------------
    server {
        listen 80;
        listen 443 ssl;
        server_name api.adhocx.com;

        location /healthz {
            access_log off;
            return 200 "adhocx-api-healthy\n";
        }

        location / {
            proxy_pass http://api_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # -------------------------------------------------------------
    # Default Fallback Server (Catch-All by IP / Unrecognized Host)
    # -------------------------------------------------------------
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        # Gateway health check
        location /healthz {
            access_log off;
            return 200 "adhocx-gateway-healthy\n";
        }

        # -------------------------------------------------------------
        # 1. API Service & WebSocket Forwarding (/api/ & /docs)
        # -------------------------------------------------------------
        location /api/ {
            proxy_pass http://api_service/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /docs {
            proxy_pass http://api_service/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 2. Admin Dashboard (/admin/)
        # -------------------------------------------------------------
        location /admin/ {
            proxy_pass http://admin_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 3. Flutter Web Mobile Client (/mobile/ or /app/)
        # -------------------------------------------------------------
        location = /mobile {
            return 301 /mobile/;
        }

        location = /app {
            return 301 /app/;
        }

        location /mobile/ {
            proxy_pass http://mobile_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /app/ {
            proxy_pass http://mobile_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 4. Marketing Website & Landing Portal (Root /)
        # -------------------------------------------------------------
        location / {
            proxy_pass http://marketing_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
